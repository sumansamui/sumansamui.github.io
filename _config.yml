# Site settings
title: "Home"
author: "Suman Samui"
description: "These pages contain information about my work, publications, and software."

# Built-in social usernames
github_username: sumansamui

# Extra social links (ORCID + LinkedIn)
social_links:
  - { platform: linkedin, user_url: "https://www.linkedin.com/in/YOUR-LINKEDIN-ID" }
  - { platform: orcid,    user_url: "https://orcid.org/YOUR-ORCID-ID" }

# Jekyll theme
theme: minima

# Minima date format
minima:
  date_format: "%b %-d, %Y"

# Pages
header_pages:
  - teaching.md
  - positions.md
  - projects.md
  - talks.md
  - appendices.md
  - blog.md

# Collections
collections:
  pubs:
    output: true
    permalink: /:name/
  appendices:
    output: true
  ssp-course:
    output: true

markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
