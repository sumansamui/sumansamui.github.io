# Run 'bundle exec jekyll serve' again if you change this file.

# Site settings
title: Home
author: Suman Samui
# email: ssamui.ece@nitdgp.ac.in
description: >
  These pages contain information about my work, publications and software.

# These stop it being portable.  Better to leave it at github.
# baseurl: "~pgarner"
# url: "http://idiap.ch"

links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/sumansamui"
    - label: "ORCID"
      icon: "ai ai-orcid"   # ORCID icon (from Academicons)
      url: "https://orcid.org/0000-0000-0000-0000"
    - label: "Google Scholar"
      icon: "ai ai-google-scholar"
      url: "https://scholar.google.com/"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://linkedin.com/"

# Build settings
markdown: kramdown
theme: minima

# Minima date format; refer to http://shopify.github.io/liquid/filters/date/
minima:
  date_format: "%b %-d, %Y"

# Specific pages that should appear in the header; order is respected.
header_pages:
 - teaching.md
 - positions.md
 - projects.md
 - talks.md
 - appendices.md
 - blog.md

# Collections of things.
# Flatten the publications so the css path works with baseurls
collections:
 pubs:
   permalink: /:name
   output: true
 appendices:
   output: true
 ssp-course:
   output: true

# Exclude from processing.
exclude:
 - Gemfile
 - Gemfile.lock
